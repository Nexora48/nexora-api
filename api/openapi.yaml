openapi: 3.0.3
info: { title: Nexora API, version: 0.4.0, description: "M1 auth/tenancy/RBAC + M2 society setup + M3 SuperAdmin console. Success: {data, meta}. Error: {error:{code,message,details}}." }
servers: [{ url: "http://localhost:8080" }]
paths:
  /health: { get: { summary: Liveness, responses: { "200": { description: OK } } } }
  /ready: { get: { summary: Readiness, responses: { "200": { description: Ready }, "503": { description: Dependency down } } } }
  /api/v1/auth/otp/request:
    post:
      summary: Send login OTP to a registered phone
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OTPRequest" } } } }
      responses:
        "204": { description: Sent }
        "400": { description: INVALID_PHONE }
        "404": { description: PHONE_NOT_REGISTERED }
        "429": { description: OTP_COOLDOWN / OTP_RATE_LIMITED }
  /api/v1/auth/otp/verify:
    post:
      summary: Verify OTP. Returns a session, or selection_required with memberships.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OTPVerify" } } } }
      responses:
        "200": { description: Login result, content: { application/json: { schema: { $ref: "#/components/schemas/LoginResponse" } } } }
        "401": { description: OTP_INVALID / OTP_EXPIRED }
        "403": { description: SOCIETY_SUSPENDED }
  /api/v1/auth/login:
    post:
      summary: Email+password login (society_admin, committee only)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PasswordLogin" } } } }
      responses:
        "200": { description: Login result, content: { application/json: { schema: { $ref: "#/components/schemas/LoginResponse" } } } }
        "401": { description: INVALID_CREDENTIALS }
        "403": { description: NOT_AUTHORISED / SOCIETY_SUSPENDED }
        "429": { description: ACCOUNT_LOCKED }
  /api/v1/auth/select-society:
    post:
      summary: Choose a society after multi-membership login
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [selection_token, membership_id], properties: { selection_token: { type: string }, membership_id: { type: string, format: uuid }, device: { $ref: "#/components/schemas/Device" } } } } } }
      responses: { "200": { description: Session }, "403": { description: FORBIDDEN } }
  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh token. Reuse of an old token revokes the session (TOKEN_REUSED).
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [refresh_token], properties: { refresh_token: { type: string } } } } } }
      responses: { "200": { description: New session }, "401": { description: TOKEN_INVALID / TOKEN_EXPIRED / TOKEN_REUSED } }
  /api/v1/auth/logout:
    post:
      summary: Revoke the refresh-token family
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [refresh_token], properties: { refresh_token: { type: string } } } } } }
      responses: { "204": { description: Logged out } }
  /api/v1/me:
    get:
      summary: Profile, membership, society, permissions, features
      security: [{ bearer: [] }]
      responses: { "200": { description: OK }, "401": { description: UNAUTHORIZED / TOKEN_EXPIRED }, "403": { description: SOCIETY_SUSPENDED } }
  /api/v1/me/features:
    get: { summary: Feature map for the society, security: [{ bearer: [] }], responses: { "200": { description: "{key: bool}" } } }
  /api/v1/me/devices:
    put:
      summary: Register device / FCM token
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Device" } } } }
      responses: { "204": { description: Saved } }
  /api/v1/society/blocks:
    get: { summary: "Blocks with unit/occupied counts (resident.read)", security: [{ bearer: [] }], responses: { "200": { description: OK } } }
    post: { summary: "Create block (society.manage). 409 BLOCK_EXISTS", security: [{ bearer: [] }], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, code], properties: { name: { type: string }, code: { type: string } } } } } }, responses: { "201": { description: Created } } }
  /api/v1/society/blocks/{id}:
    put: { summary: Update block, security: [{ bearer: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "204": { description: OK } } }
    delete: { summary: "Delete block. 409 BLOCK_NOT_EMPTY if it has residents/history", security: [{ bearer: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "204": { description: Deleted } } }
  /api/v1/society/blocks/{id}/units/bulk:
    post:
      summary: "Generate flats floors x units_per_floor (start_floor default 1; number_format tokens {block} {floor} {seq} {seq:02} {seq:03}). ?dry_run=true previews."
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [floors, units_per_floor, unit_type], properties: { floors: { type: integer }, units_per_floor: { type: integer }, start_floor: { type: integer }, unit_type: { type: string, enum: [1BHK, 2BHK, 3BHK, 4BHK, Villa, Shop, Studio] }, number_format: { type: string } } } } } }
      responses: { "201": { description: Created }, "200": { description: Dry-run result } }
  /api/v1/society/units:
    get: { summary: "Units (filters block_id, floor, occupancy, q; paged)", security: [{ bearer: [] }], responses: { "200": { description: OK } } }
    post: { summary: "Create unit. 409 UNIT_EXISTS", security: [{ bearer: [] }], responses: { "201": { description: Created } } }
  /api/v1/society/units/{id}:
    get: { summary: Unit with derived occupancy, security: [{ bearer: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: OK } } }
    put: { summary: Update unit, security: [{ bearer: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "204": { description: OK } } }
    delete: { summary: "Delete unit. 409 UNIT_OCCUPIED", security: [{ bearer: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "204": { description: Deleted } } }
  /api/v1/society/apartments:
    get: { summary: "Tree for the Apartments screen: blocks > floors > flats with occupant", security: [{ bearer: [] }], responses: { "200": { description: OK } } }
  /api/v1/society/stats:
    get: { summary: "Counts for the admin dashboard", security: [{ bearer: [] }], responses: { "200": { description: OK } } }
  /api/v1/society/residents:
    get: { summary: "Residents (type owner|tenant|family, status active|pending|suspended|inactive, unit_id, q, page, page_size)", security: [{ bearer: [] }], responses: { "200": { description: OK } } }
    post: { summary: "Create resident (resident.manage). 409 UNIT_ROLE_TAKEN | ALREADY_RESIDENT | NO_HEAD | EMAIL_TAKEN", security: [{ bearer: [] }], responses: { "201": { description: Created } } }
  /api/v1/society/residents/{id}:
    get: { summary: "Resident detail (id = membership id) incl. family, vehicles, emergency contact", security: [{ bearer: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: OK } } }
    put: { summary: "Edit. 403 USER_SHARED when changing name/email of a person in several societies", security: [{ bearer: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: OK } } }
  /api/v1/society/residents/{id}/suspend: { post: { summary: Suspend (revokes sessions), security: [{ bearer: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "204": { description: OK }, "409": { description: INVALID_STATE } } } }
  /api/v1/society/residents/{id}/restore: { post: { summary: Restore, security: [{ bearer: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "204": { description: OK } } } }
  /api/v1/society/residents/{id}/move-out: { post: { summary: "Move out (frees flat, ends household logins)", security: [{ bearer: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "204": { description: OK } } } }
  /api/v1/society/residents/import:
    post: { summary: "CSV import (multipart field file, <=1000 rows, <=2MB). ?dry_run=true validates only. Columns: full_name,phone,email,unit,role,move_in_date", security: [{ bearer: [] }], responses: { "200": { description: "{total,valid,created,errors[{row,message}]}" } } }
  /api/v1/society/residents/import/template:
    get: { summary: CSV template, security: [{ bearer: [] }], responses: { "200": { description: text/csv } } }
  /api/v1/me/profile: { put: { summary: "Edit own name/email (403 USER_SHARED if in several societies)", security: [{ bearer: [] }], responses: { "204": { description: OK } } } }
  /api/v1/me/emergency-contact:
    get: { summary: Own emergency contact (null if unset), security: [{ bearer: [] }], responses: { "200": { description: OK } } }
    put: { summary: Set emergency contact, security: [{ bearer: [] }], responses: { "204": { description: OK } } }
  /api/v1/me/unit: { get: { summary: "Own flat + household + vehicle count", security: [{ bearer: [] }], responses: { "200": { description: OK } } } }
  /api/v1/me/family:
    get: { summary: Family of the caller (owner/tenant only), security: [{ bearer: [] }], responses: { "200": { description: OK } } }
    post: { summary: "Add family member; with phone they get a limited login", security: [{ bearer: [] }], responses: { "201": { description: Created } } }
  /api/v1/me/family/{id}:
    put: { summary: Update, security: [{ bearer: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "204": { description: OK } } }
    delete: { summary: Remove (revokes their login), security: [{ bearer: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "204": { description: OK } } }
  /api/v1/me/vehicles:
    get: { summary: Vehicles of the caller's flat, security: [{ bearer: [] }], responses: { "200": { description: OK } } }
    post: { summary: "Add vehicle (number normalised, unique per society). 409 VEHICLE_EXISTS", security: [{ bearer: [] }], responses: { "201": { description: Created } } }
  /api/v1/me/vehicles/{id}:
    put: { summary: Update, security: [{ bearer: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "204": { description: OK } } }
    delete: { summary: Delete, security: [{ bearer: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "204": { description: OK } } }
  /api/v1/superadmin/auth/login:
    post: { summary: "Step 1 (password). Returns mfa_required, or mfa_setup_required with the TOTP secret and otpauth_url on first sign-in. Never issues a session.", requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string } } } } } }, responses: { "200": { description: MFA step }, "401": { description: INVALID_CREDENTIALS }, "429": { description: ACCOUNT_LOCKED } } }
  /api/v1/superadmin/auth/mfa/verify:
    post: { summary: "Step 2. 6-digit TOTP code (single use) or recovery_code. First enrolment also returns 8 recovery codes.", requestBody: { required: true, content: { application/json: { schema: { type: object, required: [mfa_token], properties: { mfa_token: { type: string }, code: { type: string }, recovery_code: { type: string } } } } } }, responses: { "200": { description: Session }, "401": { description: MFA_INVALID / MFA_EXPIRED }, "429": { description: ACCOUNT_LOCKED } } }
  /api/v1/superadmin/auth/refresh:
    post: { summary: Rotate platform refresh token (reuse revokes the session), requestBody: { required: true, content: { application/json: { schema: { type: object, required: [refresh_token], properties: { refresh_token: { type: string } } } } } }, responses: { "200": { description: Session } } }
  /api/v1/superadmin/auth/logout:
    post: { summary: Revoke the platform session, security: [{ platform: [] }], responses: { "204": { description: OK } } }
  /api/v1/superadmin/me:
    get: { summary: Signed-in staff member, security: [{ platform: [] }], responses: { "200": { description: OK } } }
  /api/v1/superadmin/societies:
    get: { summary: "Societies with counts, last sign-in and enabled-service count (q, status, page, page_size)", security: [{ platform: [] }], responses: { "200": { description: OK } } }
    post: { summary: "Onboard a society and its first admin (super_admin). Returns admin_credentials with a one-time temporary_password.", security: [{ platform: [] }], responses: { "201": { description: Created }, "409": { description: SLUG_TAKEN / EMAIL_TAKEN } } }
  /api/v1/superadmin/societies/{id}:
    get: { summary: "Detail: profile, counts, admins, services (default vs override), recent activity", security: [{ platform: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: OK } } }
    put: { summary: Edit society profile (super_admin), security: [{ platform: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: OK } } }
  /api/v1/superadmin/societies/{id}/suspend:
    post: { summary: "Suspend (reason required): blocks sign-in and revokes sessions (super_admin)", security: [{ platform: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "204": { description: OK }, "409": { description: ALREADY_SUSPENDED } } }
  /api/v1/superadmin/societies/{id}/reactivate:
    post: { summary: Reactivate a suspended society (super_admin), security: [{ platform: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "204": { description: OK }, "409": { description: NOT_SUSPENDED } } }
  /api/v1/superadmin/societies/{id}/admins:
    post: { summary: "Add a society admin (super_admin); one-time temporary password", security: [{ platform: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "201": { description: Created }, "409": { description: ALREADY_ADMIN } } }
  /api/v1/superadmin/societies/{id}/admins/{userId}/reset-password:
    post: { summary: "New one-time temporary password, forces change, revokes sessions (super_admin)", security: [{ platform: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: userId, in: path, required: true, schema: { type: string } }], responses: { "200": { description: OK } } }
  /api/v1/superadmin/societies/{id}/features/{key}:
    put: { summary: "Switch one service on/off for a society (super_admin). Body {enabled, reason}. Takes effect on the next API call; audited with before/after.", security: [{ platform: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: key, in: path, required: true, schema: { type: string } }], responses: { "200": { description: Updated service list }, "400": { description: FEATURE_UNKNOWN } } }
  /api/v1/superadmin/societies/{id}/features/bulk:
    post: { summary: "Switch several services atomically. Body {features:{key:bool}, reason}", security: [{ platform: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: OK } } }
  /api/v1/superadmin/features:
    get: { summary: Service catalogue (read-only), security: [{ platform: [] }], responses: { "200": { description: OK } } }
  /api/v1/superadmin/audit:
    get: { summary: "Audit log (society_id, actor, action or prefix like feature.*, from, to, page)", security: [{ platform: [] }], responses: { "200": { description: OK } } }
  /api/v1/superadmin/stats:
    get: { summary: Platform totals for the dashboard, security: [{ platform: [] }], responses: { "200": { description: OK } } }
  /api/v1/auth/change-password:
    post: { summary: "Change own password (also lifts the temporary-password gate). Returns a fresh session; all other sessions are revoked.", security: [{ bearer: [] }], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [current_password, new_password], properties: { current_password: { type: string }, new_password: { type: string } } } } } }, responses: { "200": { description: Session }, "400": { description: WEAK_PASSWORD }, "401": { description: INVALID_CREDENTIALS } } }
components:
  securitySchemes: { bearer: { type: http, scheme: bearer, bearerFormat: JWT }, platform: { type: http, scheme: bearer, bearerFormat: JWT, description: Platform staff token (separate audience and secret) } }
  schemas:
    Device: { type: object, required: [device_id], properties: { device_id: { type: string }, platform: { type: string }, app_version: { type: string }, fcm_token: { type: string } } }
    OTPRequest: { type: object, required: [phone], properties: { phone: { type: string, example: "9999999999" } } }
    OTPVerify: { type: object, required: [phone, otp], properties: { phone: { type: string }, otp: { type: string, example: "123456" }, device: { $ref: "#/components/schemas/Device" } } }
    PasswordLogin: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string }, device: { $ref: "#/components/schemas/Device" } } }
    Membership: { type: object, properties: { id: { type: string }, society_id: { type: string }, society_name: { type: string }, unit_id: { type: string }, role: { type: string } } }
    LoginResponse:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string }
        expires_in: { type: integer }
        membership: { $ref: "#/components/schemas/Membership" }
        selection_required: { type: boolean }
        selection_token: { type: string }
        memberships: { type: array, items: { $ref: "#/components/schemas/Membership" } }
    Error: { type: object, properties: { error: { type: object, properties: { code: { type: string }, message: { type: string }, details: { type: object } } } } }
